services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: tickdesk-db
    environment:
      POSTGRES_USER: tick
      POSTGRES_PASSWORD: tick
      POSTGRES_DB: tickdesk
    ports:
      - "5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - tickdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c max_wal_size=4GB
      -c checkpoint_timeout=30min
      -c maintenance_work_mem=512MB
      -c synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tick -d tickdesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: tickdesk-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  tickdata:
